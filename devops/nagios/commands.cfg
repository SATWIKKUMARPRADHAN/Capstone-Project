# Nagios Commands & Self-Healing Webhook Event Handlers

# Standard Host Ping Check
define command {
    command_name    check-host-alive
    command_line    $USER1$/check_ping -H $HOSTADDRESS$ -w 3000.0,80% -c 5000.0,100% -p 5
}

# Custom Exam Application Health Endpoint Check (HTTP 200 OK expected)
define command {
    command_name    check_exam_http
    command_line    $USER1$/check_http -H $HOSTADDRESS$ -p $ARG1$ -u /api/exam/health -s '"status":"healthy"' -t 10
}

# NRPE Remote Metric Checks (Windows NSClient++ / Linux NRPE)
define command {
    command_name    check_nrpe_cpu
    command_line    $USER1$/check_nrpe -H $HOSTADDRESS$ -c check_cpu -a warn=80 crit=92
}

define command {
    command_name    check_nrpe_mem
    command_line    $USER1$/check_nrpe -H $HOSTADDRESS$ -c check_memory -a warn=82 crit=95
}

define command {
    command_name    check_nrpe_disk
    command_line    $USER1$/check_nrpe -H $HOSTADDRESS$ -c check_drivesize -a warn=85 crit=95
}

# Event Handler: Forward Service/Host Alerts directly to LabGuard Node.js Backend
define command {
    command_name    notify-labguard-backend
    command_line    /usr/local/nagios/libexec/notify-backend.sh "$HOSTNAME$" "$SERVICEDESC$" "$SERVICESTATE$" "$SERVICESTATETYPE$" "$SERVICEATTEMPT$" "$SERVICEOUTPUT$"
}
