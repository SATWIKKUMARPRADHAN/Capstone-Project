# Nagios Service Monitoring for Custom Examination Application

define service {
    use                     generic-service
    hostgroup_name          lab-workstations
    service_description     Exam_Application_Health
    check_command           check_exam_http!3000
    check_interval          1
    retry_interval          0.5
    max_check_attempts      2
    event_handler           notify-labguard-backend
    event_handler_enabled   1
    notifications_enabled   1
}
