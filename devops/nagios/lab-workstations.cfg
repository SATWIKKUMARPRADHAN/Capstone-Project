# LabGuard Laboratory Workstation Hosts & Service Definitions

define hostgroup {
    hostgroup_name  lab-workstations
    alias           B.Tech Examination Computer Lab 1
    members         WS-LAB1-01,WS-LAB1-02,WS-LAB1-03,WS-LAB1-04,WS-LAB1-05,WS-LAB1-06,WS-LAB1-07,WS-LAB1-08
}

define host {
    name                    windows-workstation-template
    use                     generic-host
    check_command           check-host-alive
    max_check_attempts      3
    check_interval          1
    retry_interval          0.5
    check_period            24x7
    notification_interval   15
    notification_period     24x7
    register                0
}

define host {
    use         windows-workstation-template
    host_name   WS-LAB1-01
    alias       Lab 1 Seat 01 (Windows 11)
    address     192.168.10.101
}

define host {
    use         windows-workstation-template
    host_name   WS-LAB1-02
    alias       Lab 1 Seat 02 (Windows 11)
    address     192.168.10.102
}

define host {
    use         windows-workstation-template
    host_name   WS-LAB1-03
    alias       Lab 1 Seat 03 (Windows 11)
    address     192.168.10.103
}

define host {
    use         windows-workstation-template
    host_name   WS-LAB1-04
    alias       Lab 1 Seat 04 (Windows 10)
    address     192.168.10.104
}

# CPU Utilization Service Check across all lab workstations
define service {
    use                     generic-service
    hostgroup_name          lab-workstations
    service_description     CPU_Utilization
    check_command           check_nrpe_cpu
    check_interval          1
    retry_interval          1
    max_check_attempts      2
    event_handler           notify-labguard-backend
    event_handler_enabled   1
}

# Memory Utilization Service Check
define service {
    use                     generic-service
    hostgroup_name          lab-workstations
    service_description     Memory_Utilization
    check_command           check_nrpe_mem
    check_interval          1
    retry_interval          1
    max_check_attempts      2
    event_handler           notify-labguard-backend
    event_handler_enabled   1
}

# Disk Space Service Check
define service {
    use                     generic-service
    hostgroup_name          lab-workstations
    service_description     Disk_Utilization
    check_command           check_nrpe_disk
    check_interval          2
    retry_interval          1
    max_check_attempts      2
    event_handler           notify-labguard-backend
    event_handler_enabled   1
}
