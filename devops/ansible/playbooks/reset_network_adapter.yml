---
- name: Reset Network Adapter & Flush DNS on Lab Workstation
  hosts: "{{ target_host | default('windows_workstations') }}"
  gather_facts: false
  tasks:
    - name: Flush DNS resolver cache and renew DHCP lease
      ansible.windows.win_shell: |
        ipconfig /flushdns
        ipconfig /release
        ipconfig /renew

    - name: Verify connectivity to LabGuard Server
      ansible.windows.win_shell: |
        Test-NetConnection -ComputerName 192.168.10.10 -Port 3000 -InformationLevel Quiet
      register: net_check
